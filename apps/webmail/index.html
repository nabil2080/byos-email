<!DOCTYPE html>
<html lang="en" data-theme="cloud_dancer">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%239E725F'/><text x='16' y='21' font-family='sans-serif' font-size='14' font-weight='bold' fill='%23FAF9F6' text-anchor='middle'>B</text></svg>" />
    <title>BYOS Webmail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('byos_theme');
          if (t === 'dark') {
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.dataset.theme = 'cloud_dancer';
            document.documentElement.classList.remove('dark');
            if (!t) {
              localStorage.setItem('byos_theme', 'cloud_dancer');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F0EEE9] dark:bg-[#121316] text-[#1A1B1E] dark:text-[#F3F4F6] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
