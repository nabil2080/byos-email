[package]
name = "byos-outbound-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
byos-crypto-core = { path = "../../packages/crypto-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "smtp-transport", "builder"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
mailparse = "0.14"
