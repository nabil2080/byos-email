# Rspamd HTTP check endpoint configuration
# This enables the /check endpoint for inbound-bridge to call

# Enable HTTP server for check endpoint on dedicated port to avoid conflict with proxy worker
bind_socket = "0.0.0.0:11333";
bind_socket = "0.0.0.0:11334";

# Enable HTTP controller for /check endpoint
http {
  enabled = true;
  bind_socket = "0.0.0.0:11333";
  enable_check = true;
}

# Disable milter mode - we use HTTP check endpoint instead
milter = false;

# Disable proxy worker (milter proxy) to avoid port conflict with HTTP check endpoint
proxy {
  enabled = false;
}

# Enable controller for web UI (optional)
controller {
  enabled = true;
  bind_socket = "0.0.0.0:11334";
  password = "";  # No auth for local dev
}

# Logging
logging {
  type = console;
  level = info;
}

# Classifier (Bayesian)
classifier {
  # Minimal for dev
}

# DKIM signing/verification
dkim_signing {
  # Outbound handled by outbound worker
}

# SPF/DKIM/DMARC
spf = true;
dkim = true;
dmarc = true;

# Score thresholds
actions {
  reject = 15.0;
  add_header = 6.0;
  rewrite_subject = 10.0;
  greylist = 4.0;
}

# Symbols
symbols {
  SPF_PASS = -2.0;
  SPF_FAIL = 5.0;
  DKIM_VALID = -2.0;
  DKIM_INVALID = 5.0;
  DMARC_POLICY_REJECT = 5.0;
  DMARC_POLICY_QUARANTINE = 2.0;
}

# Disable learning for now
bayes {
  enabled = false;
}

# Redis for caching (optional)
redis {
  servers = "redis:6379";
}

# No persistent message storage
message_storage {
  type = "memory";
}