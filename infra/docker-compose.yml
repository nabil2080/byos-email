name: byos-email

services:
  postgres:
    image: postgres:16-alpine
    container_name: byos-postgres
    environment:
      POSTGRES_DB: byos
      POSTGRES_USER: byos
      POSTGRES_PASSWORD: byos_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byos -d byos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: byos-redis
    ports:
      - "127.0.0.1:6379:6379"
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: byos-minio
    environment:
      MINIO_ROOT_USER: byosminio
      MINIO_ROOT_PASSWORD: byosminio_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  postfix:
    image: boky/postfix:latest
    container_name: byos-postfix
    environment:
      POSTFIX_RELAYHOST: "${POSTFIX_RELAYHOST:-[mailpit]:1025}"
      ALLOWED_SENDER_DOMAINS: byos.local
      HOSTNAME: mail.byos.local
      POSTFIX_mydestination: localhost, localhost.localdomain, byos.local
      POSTFIX_relay_domains: ""
      POSTFIX_local_recipient_maps: ""
      POSTFIX_smtpd_recipient_restrictions: permit_mynetworks, reject_unauth_destination
      # No milters - Rspamd is now a standalone service called by inbound-bridge
      POSTFIX_smtpd_milters: ""
      POSTFIX_non_smtpd_milters: ""
      POSTFIX_milter_default_action: accept
      POSTFIX_milter_protocol: "6"
    ports:
      - "127.0.0.1:2525:587"
    volumes:
      - ./postfix/init:/docker-init.d:ro
    secrets:
      - ses_smtp_credentials
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  rspamd:
    image: rspamd/rspamd:latest
    container_name: byos-rspamd
    expose:
      - "11333"
      - "11334"
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
    healthcheck:
      # Port 11333 = normal worker (HTTP /check endpoint used by inbound-bridge).
      # TCP probe avoids requiring wget/curl inside the rspamd image.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/11333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: byos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 byosminio byosminio_dev_password &&
        mc mb --ignore-existing local/byos-mailbox &&
        echo 'minio-init: bucket byos-mailbox ready'
      "
    # One-shot: exits 0 after bucket creation; do not restart.
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: byos-api
    ports:
      - "127.0.0.1:8080:8080"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: "postgres://byos:byos_dev_password@postgres:5432/byos"
      REDIS_ADDR: "redis:6379"
      MINIO_ADDR: "minio:9000"
      POSTFIX_ADDR: "postfix:25"
      RSPAMD_ADDR: "rspamd:11334"
      OUTBOUND_DELIVERY_PK_FILE: /run/secrets/outbound_delivery_pk
      CRYPTO_WORKER_URL: "http://crypto-worker:8084"
      BYOS_LEGACY_AUTH_ENABLED: "false"
      BYOS_ENV: "development"
      BYOS_DEV_MODE: "${BYOS_DEV_MODE}"
      BYOS_ALLOWED_ORIGINS: "${BYOS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001,http://127.0.0.1:3002,http://localhost:3002,http://127.0.0.1:3003,http://localhost:3003,http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4321,http://localhost:4321,http://127.0.0.1:5173,http://localhost:5173,http://192.168.0.101:3000,http://192.168.0.101:3001,http://192.168.0.101:3002,http://192.168.0.101:3003}"
      STORAGE_HEALTH_INTERVAL: "${STORAGE_HEALTH_INTERVAL:-300}"
      STORAGE_WORKER_INTERNAL_KEY_FILE: /run/secrets/storage_worker_internal_key
      INTERNAL_API_KEY_FILE: /run/secrets/internal_api_key
      OTP_DELIVERY_MODE: "${OTP_DELIVERY_MODE:-mock}"
      OTP_DEV_ALLOWED_EMAILS: "${OTP_DEV_ALLOWED_EMAILS:-abdullahrawha30@gmail.com}"
      OTP_DEV_ALLOWED_PHONE_NUMBERS: "${OTP_DEV_ALLOWED_PHONE_NUMBERS:-+8801617856836}"
      OTP_HMAC_SECRET: "${OTP_HMAC_SECRET}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-security@byos.local}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-BYOS Security}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION:-starttls}"
      OTP_SMS_PROVIDER: "${OTP_SMS_PROVIDER:-mock}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER}"
      GREENWEB_TOKEN: "${GREENWEB_TOKEN}"
      SMS_GATEWAY_URL: "${SMS_GATEWAY_URL}"
      SMS_GATEWAY_KEY: "${SMS_GATEWAY_KEY}"
      SMS_SENDER_ID: "${SMS_SENDER_ID:-BYOS}"
    secrets:
      - outbound_delivery_pk
      - storage_worker_internal_key
      - internal_api_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  mail-router:
    build: ../services/mail-router
    container_name: byos-mail-router
    expose:
      - "8081"
      - "8082"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: "postgres://byos:byos_dev_password@postgres:5432/byos"
      MAIL_ROUTER_PORT: "8081"
      MAIL_ROUTER_HEALTH_PORT: "8082"
      CRYPTO_WORKER_URL: "http://crypto-worker:8084"
      STORAGE_WORKER_URL: "http://storage-worker:8083"
      STORAGE_WORKER_INTERNAL_KEY_FILE: /run/secrets/storage_worker_internal_key
      MAIL_ROUTER_INTERNAL_KEY_FILE: /run/secrets/mail_router_internal_key
      REDIS_ADDR: "redis:6379"
    secrets:
      - storage_worker_internal_key
      - mail_router_internal_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health | grep -q healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-worker:
        condition: service_started
      crypto-worker:
        condition: service_started

  storage-worker:
    build: ../services/storage-worker
    container_name: byos-storage-worker
    expose:
      - "8083"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: "postgres://byos:byos_dev_password@postgres:5432/byos"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "byosminio"
      MINIO_SECRET_KEY: "byosminio_dev_password"
      MINIO_BUCKET: "byos-mailbox"
      STORAGE_WORKER_PORT: "8083"
      STORAGE_DEK_FILE: /run/secrets/storage_dek
      STORAGE_WORKER_INTERNAL_KEY_FILE: /run/secrets/storage_worker_internal_key
    secrets:
      - storage_dek
      - storage_worker_internal_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health | grep -q healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  crypto-worker:
    build:
      context: ..
      dockerfile: services/native-crypto-worker/Dockerfile
    container_name: byos-crypto-worker
    expose:
      - "8084"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      CRYPTO_WORKER_PORT: "8084"
      OUTBOUND_DELIVERY_SK_FILE: /run/secrets/outbound_delivery_sk
      CRYPTO_WORKER_INTERNAL_KEY_FILE: /run/secrets/crypto_worker_internal_key
    secrets:
      - outbound_delivery_sk
      - crypto_worker_internal_key
    healthcheck:
      # debian:bookworm-slim has no wget/curl; use TCP probe to verify the
      # Axum HTTP server is listening on port 8084.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8084' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  inbound-bridge:
    build: ../services/inbound-bridge
    container_name: byos-inbound-bridge
    ports:
      # Port 25 bound on all interfaces: inbound-bridge IS the SMTP MX listener.
      # For a local-only profile, change to "127.0.0.1:2225:25" to avoid conflicts.
      - "25:25"
      - "127.0.0.1:8085:8085"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      INBOUND_LISTEN: ":25"
      INBOUND_HEALTH_LISTEN: ":8085"
      MAIL_ROUTER_URL: "http://mail-router:8081"
      RSPAMD_URL: "http://rspamd:11333"
      MAIL_ROUTER_INTERNAL_KEY_FILE: /run/secrets/mail_router_internal_key
    secrets:
      - mail_router_internal_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/health | grep -q healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      mail-router:
        condition: service_started
      rspamd:
        condition: service_healthy

  outbound-worker:
    build:
      context: ..
      dockerfile: services/outbound-worker/Dockerfile.rust
    container_name: byos-outbound-worker
    expose:
      - "8086"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: "postgres://outbound_worker_login:byos_outbound_worker_dev@postgres:5432/byos"
      REDIS_ADDR: "redis:6379"
      OUTBOUND_DELIVERY_SK_FILE: /run/secrets/outbound_delivery_sk
      OUTBOUND_WORKER_DB_PASSWORD_FILE: /run/secrets/outbound_worker_db_password
      POSTFIX_ADDR: "postfix:25"
      OUTBOUND_WORKER_ADDR: ":8086"
      POLL_INTERVAL_MS: "5000"
      RUST_LOG: info
      BYOS_DKIM_DEK_FILE: /run/secrets/byos_dkim_dek
      CRYPTO_WORKER_INTERNAL_KEY_FILE: /run/secrets/crypto_worker_internal_key
      INTERNAL_API_KEY_FILE: /run/secrets/internal_api_key
      BYOS_API_ADDR: "api:8080"
    secrets:
      - outbound_delivery_sk
      - outbound_worker_db_password
      - byos_dkim_dek
      - crypto_worker_internal_key
      - internal_api_key
    depends_on:
      postgres:
        condition: service_healthy
      crypto-worker:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: byos-mailpit
    networks:
      - byos-net
      - default
    ports:
      - "127.0.0.1:8025:8025"    # web UI
      - "127.0.0.1:1025:1025"    # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin-api:
    build:
      context: ..
      dockerfile: services/admin-api/Dockerfile
    container_name: byos-admin-api
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      PORT: "8087"
      BYOS_DEV_MODE: "1"
      SUPPORT_DB_URL: "postgres://role_support_agent:support_crm_password@postgres:5432/byos"
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    container_name: byos-control-plane
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_API_URL: "http://api:8080"
    depends_on:
      api:
        condition: service_started

  webmail:
    build:
      context: ..
      dockerfile: apps/webmail/Dockerfile
    container_name: byos-webmail
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_API_URL: "http://api:8080"
    depends_on:
      api:
        condition: service_started

  public-site:
    build:
      context: ..
      dockerfile: apps/public-site/Dockerfile
    container_name: byos-public-site
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      ASTRO_DEV_BACKGROUND: "false"
      ASTRO_HOST: "0.0.0.0"
      PUBLIC_CP_URL: "http://localhost:3000"
      PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      control-plane:
        condition: service_started

  support-crm:
    build:
      context: ..
      dockerfile: apps/support-crm/Dockerfile
    container_name: byos-support-crm
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_ADMIN_API_URL: "http://admin-api:8087"
    depends_on:
      admin-api:
        condition: service_started

secrets:
  outbound_delivery_sk:
    file: ./secrets/outbound_delivery_sk.b64
  outbound_delivery_pk:
    file: ./secrets/outbound_delivery_pk.b64
  outbound_worker_db_password:
    file: ./secrets/outbound_worker_db_password.txt
  byos_dkim_dek:
    file: ./secrets/byos_dkim_dek.b64
  storage_dek:
    file: ./secrets/storage_dek.b64
  storage_worker_internal_key:
    file: ./secrets/storage_worker_internal_key.txt
  mail_router_internal_key:
    file: ./secrets/mail_router_internal_key.txt
  crypto_worker_internal_key:
    file: ./secrets/crypto_worker_internal_key.txt
  internal_api_key:
    file: ./secrets/internal_api_key.txt
  ses_smtp_credentials:
    file: ./secrets/ses_smtp_credentials.txt

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  byos-net: